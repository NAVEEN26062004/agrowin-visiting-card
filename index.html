<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROWIN Technology - Contact Card</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151e2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .header p {
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .profiles {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      flex-shrink: 0;
      background-color: #243046;
    }

    .info {
      flex: 1;
    }

    .info h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .info .role {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
      margin-top: 2px;
    }

    .info .desc {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #042f2e;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-save:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .quick-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>AGROWIN Technology</h1>
      <p>Save contact directly to your phone</p>
    </div>

    <div class="profiles">
      <!-- Founder 1 -->
      <div class="card">
        <div class="profile-top">
          <img src="naveen.jpg" alt="Naveen Kumar" class="avatar" onerror="this.src='https://via.placeholder.com/60?text=NK'">
          <div class="info">
            <h2>Naveen Kumar</h2>
            <div class="role">Founder & Tech Lead</div>
            <div class="desc">Hardware, Embedded IoT & R&D</div>
          </div>
        </div>

        <a href="intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;S.name=Naveen%20Kumar;S.phone=%2B917598557533;S.email=agrowintechnology%40gmail.com;S.company=AGROWIN%20Technology%20Pvt%20Ltd;S.job_title=Founder%20%26%20Tech%20Lead;S.postal=Erode%2C%20Tamil%20Nadu;end" class="btn-save">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Save to Contacts
        </a>

        <div class="quick-actions">
          <a href="tel:+917598557533" class="btn-action">📞 Call</a>
          <a href="https://wa.me/917598557533" class="btn-action">💬 WhatsApp</a>
        </div>
      </div>

      <!-- Founder 2 -->
      <div class="card">
        <div class="profile-top">
          <img src="cofounder.jpg" alt="Co-Founder" class="avatar" onerror="this.src='https://via.placeholder.com/60?text=CF'">
          <div class="info">
            <h2>Co-Founder Name</h2>
            <div class="role">Co-Founder</div>
            <div class="desc">Operations & Field Deployment</div>
          </div>
        </div>

        <a href="intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;S.name=Co-Founder%20Name;S.phone=%2B91XXXXXXXXXX;S.email=contact%40agrowintechnology.com;S.company=AGROWIN%20Technology%20Pvt%20Ltd;S.job_title=Co-Founder;S.postal=Erode%2C%20Tamil%20Nadu;end" class="btn-save">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Save to Contacts
        </a>

        <div class="quick-actions">
          <a href="tel:+91XXXXXXXXXX" class="btn-action">📞 Call</a>
          <a href="https://wa.me/91XXXXXXXXXX" class="btn-action">💬 WhatsApp</a>
        </div>
      </div>
    </div>

    <div class="footer">
      agrowin.in &bull; Erode, Tamil Nadu
    </div>
  </div>

</body>
</html>
