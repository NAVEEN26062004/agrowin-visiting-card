<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROWIN Technology - Contact Card</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151e2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .header p {
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .profiles {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      flex-shrink: 0;
      background-color: #243046;
    }

    .info {
      flex: 1;
    }

    .info h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .info .role {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
      margin-top: 2px;
    }

    .info .desc {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #042f2e;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .btn-save:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .quick-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* Floating Banner Prompt */
    #prompt-box {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 18px;
      border-radius: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      font-size: 0.82rem;
      z-index: 99;
      text-align: center;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0% { transform: translate(-50%, 20px); opacity: 0; }
      100% { transform: translate(-50%, 0); opacity: 1; }
    }

    .footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>AGROWIN Technology</h1>
      <p>Save contact directly to your phone</p>
    </div>

    <div class="profiles">
      <!-- Founder 1 -->
      <div class="card">
        <div class="profile-top">
          <img src="naveen.jpg" alt="Naveen Kumar" class="avatar" onerror="this.src='https://via.placeholder.com/60?text=NK'">
          <div class="info">
            <h2>Naveen Kumar</h2>
            <div class="role">Founder & Tech Lead</div>
            <div class="desc">Hardware, Embedded IoT & R&D</div>
          </div>
        </div>

        <button onclick="downloadContact('founder1')" class="btn-save">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Save to Contacts
        </button>

        <div class="quick-actions">
          <a href="tel:+917598557533" class="btn-action">📞 Call</a>
          <a href="https://wa.me/917598557533" class="btn-action">💬 WhatsApp</a>
        </div>
      </div>

      <!-- Founder 2 -->
      <div class="card">
        <div class="profile-top">
          <img src="cofounder.jpg" alt="Co-Founder" class="avatar" onerror="this.src='https://via.placeholder.com/60?text=CF'">
          <div class="info">
            <h2>Co-Founder Name</h2>
            <div class="role">Co-Founder</div>
            <div class="desc">Operations & Field Deployment</div>
          </div>
        </div>

        <button onclick="downloadContact('founder2')" class="btn-save">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Save to Contacts
        </button>

        <div class="quick-actions">
          <a href="tel:+91XXXXXXXXXX" class="btn-action">📞 Call</a>
          <a href="https://wa.me/91XXXXXXXXXX" class="btn-action">💬 WhatsApp</a>
        </div>
      </div>
    </div>

    <div class="footer">
      agrowin.in &bull; Erode, Tamil Nadu
    </div>
  </div>

  <div id="prompt-box">
    👇 Tap <b>"Open"</b> on the popup below to save
  </div>

  <script>
    const contacts = {
      founder1: {
        fn: "Naveen Kumar",
        lastName: "Kumar",
        firstName: "Naveen",
        phone: "+917598557533",
        email: "agrowintechnology@gmail.com",
        title: "Founder & Tech Lead",
        org: "AGROWIN Technology Pvt Ltd",
        city: "Erode",
        state: "Tamil Nadu"
      },
      founder2: {
        fn: "Co-Founder Name",
        lastName: "Name",
        firstName: "Co-Founder",
        phone: "+91XXXXXXXXXX",
        email: "contact@agrowintechnology.com",
        title: "Co-Founder",
        org: "AGROWIN Technology Pvt Ltd",
        city: "Erode",
        state: "Tamil Nadu"
      }
    };

    function downloadContact(key) {
      const c = contacts[key];
      if (!c) return;

      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:${c.lastName};${c.firstName};;;
FN:${c.fn}
ORG:${c.org}
TITLE:${c.title}
TEL;TYPE=CELL,VOICE:${c.phone}
EMAIL;TYPE=WORK,INTERNET:${c.email}
ADR;TYPE=WORK:;;;${c.city};${c.state};;India
URL:https://agrowin.in
END:VCARD`;

      const blob = new Blob([vcard], { type: "text/x-vcard;charset=utf-8" });
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", `${c.firstName}_${c.lastName}.vcf`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.URL.revokeObjectURL(url);

      // Show instruction banner guiding the user to tap "Open"
      const prompt = document.getElementById("prompt-box");
      prompt.style.display = "block";
      setTimeout(() => {
        prompt.style.display = "none";
      }, 5000);
    }
  </script>
</body>
</html>
